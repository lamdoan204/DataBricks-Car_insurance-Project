services:

  # ============================================================
  # KAFKA BROKER 1
  # ============================================================
  kafka-1:
    image: apache/kafka:latest
    container_name: kafka-broker-1
    hostname: kafka-1

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'

      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093'

      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-1:9092,
        EXTERNAL://${KAFKA_EXTERNAL_HOST}:9092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

    volumes:
      - kafka_1_data:/var/lib/kafka/data




  kafka-2:
    image: apache/kafka:latest
    container_name: kafka-broker-2
    hostname: kafka-2

    ports:
      - "9094:9092"

    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: 'broker,controller'

      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka-1:9093,2@kafka-2:9093'


      KAFKA_LISTENERS: >
        INTERNAL://0.0.0.0:9092,
        EXTERNAL://0.0.0.0:19092,
        CONTROLLER://0.0.0.0:9093

      KAFKA_ADVERTISED_LISTENERS: >
        INTERNAL://kafka-2:9092,
        EXTERNAL://${KAFKA_EXTERNAL_HOST}:9094

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >
        INTERNAL:PLAINTEXT,
        EXTERNAL:PLAINTEXT,
        CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_LOG_DIRS: '/var/lib/kafka/data'

      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'

    volumes:
      - kafka_2_data:/var/lib/kafka/data





  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui

    ports:
      - "8080:8080"

    environment:
      KAFKA_CLUSTERS_0_NAME: 'kafka_cluster'

      # Kafka UI nằm trong Docker network
      # nên dùng INTERNAL listener
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: >
        kafka-1:9092,kafka-2:9092

    depends_on:
      - kafka-1
      - kafka-2




  python-producer:
    image: python:3.11-slim
    container_name: producer

    working_dir: /producer

    volumes:
      - ./producer:/producer

    command: >
      sh -c "pip install pyarrow confluent-kafka && tail -f /dev/null"



volumes:
  kafka_1_data:
  kafka_2_data:
